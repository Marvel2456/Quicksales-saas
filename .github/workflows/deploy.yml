name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e  # Exit on any error
            
            echo "================================"
            echo "🚀 QUICKSALES DEPLOYMENT STARTED"
            echo "================================"
            echo "Time: $(date)"
            echo "Host: $(hostname)"
            echo ""
            
            # Navigate to project directory
            echo "📁 Navigating to project directory..."
            cd ~/Quicksales-saas
            pwd
            echo ""
            
            # Update code from GitHub
            echo "📥 Pulling latest code from GitHub..."
            if [ ! -d ".git" ]; then
              echo "Git repository not found, cloning..."
              cd ~
              rm -rf Quicksales-saas
              git clone https://github.com/Marvel2456/Quicksales-saas.git
              cd Quicksales-saas
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            echo "✓ Code updated to latest from main branch"
            echo ""
            
            # Rebuild and restart containers
            echo "🔨 Building and starting containers..."
            docker compose down
            docker compose up -d --build
            echo "✓ Containers built and started"
            echo ""
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to initialize..."
            sleep 10
            echo ""
            
            # Show container status
            echo "📦 Container Status:"
            docker compose ps
            echo ""
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            docker compose exec -T web python manage.py migrate --noinput
            echo "✓ Migrations completed"
            echo ""
            
            # Collect static files
            echo "📦 Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput
            echo "✓ Static files collected"
            echo ""
            
            # Clean up unused Docker images
            echo "🧹 Cleaning up Docker images..."
            docker image prune -f
            echo "✓ Cleanup completed"
            echo ""
            
            echo "================================"
            echo "✅ DEPLOYMENT COMPLETED!"
            echo "================================"
            echo "Time: $(date)"
            echo "Application: https://marvexqs.com"
            echo ""
