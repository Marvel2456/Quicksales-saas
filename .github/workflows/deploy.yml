name: Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy code to VPS using rsync
        uses: burnett01/rsync-deployments@6.0.0
        with:
          switches: -avzr --delete --exclude='.git' --exclude='*.pyc' --exclude='__pycache__' --exclude='env/' --exclude='.env*' --exclude='db.sqlite3' --exclude='staticfiles/' --exclude='media/' --exclude='.DS_Store'
          path: ./
          remote_path: ~/Quicksales-saas/
          remote_host: ${{ secrets.HOSTINGER_HOST }}
          remote_user: ${{ secrets.HOSTINGER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e  # Exit on any error
            
            echo "================================"
            echo "🚀 QUICKSALES DEPLOYMENT STARTED"
            echo "================================"
            echo "Time: $(date)"
            echo "Host: $(hostname)"
            echo ""
            
            # Navigate to project directory
            echo "📁 Navigating to project directory..."
            cd ~/Quicksales-saas
            pwd
            echo ""
            
            # Rebuild and restart containers
            echo "🔨 Building and starting containers..."
            docker compose down
            docker compose up -d --build
            echo "✓ Containers built and started"
            echo ""
            
            # Wait for services to be ready
            echo "⏳ Waiting for services to initialize..."
            sleep 10
            echo ""
            
            # Show container status
            echo "📦 Container Status:"
            docker compose ps
            echo ""
            
            # Run database migrations
            echo "🗄️ Running database migrations..."
            docker compose exec -T web python manage.py migrate --noinput
            echo "✓ Migrations completed"
            echo ""
            
            # Collect static files
            echo "📦 Collecting static files..."
            docker compose exec -T web python manage.py collectstatic --noinput
            echo "✓ Static files collected"
            echo ""
            
            # Clean up unused Docker images
            echo "🧹 Cleaning up Docker images..."
            docker image prune -f
            echo "✓ Cleanup completed"
            echo ""
            
            echo "================================"
            echo "✅ DEPLOYMENT COMPLETED!"
            echo "================================"
            echo "Time: $(date)"
            echo "Application: https://marvexqs.com"
            echo ""
