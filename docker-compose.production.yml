version: '3.8'

# Production Environment Docker Compose
# Usage: docker-compose -f docker-compose.production.yml up -d
# WARNING: This is for reference. In production, use managed services (AWS RDS, ElastiCache, etc)

networks:
  production-net:
    driver: bridge

services:
  web:
    networks:
      - production-net
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: quicksales_production
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn ImsV3.wsgi:application --bind 0.0.0.0:8000 --workers=6 --worker-class=uvicorn.workers.UvicornWorker --max-requests=1000
      "
    ports:
      - "8002:8000"  # Different port, use reverse proxy in production
    volumes:
      - production_static:/app/staticfiles
      - production_media:/app/media
      - production_logs:/app/logs
    depends_on:
      - db
      - redis
    env_file:
      - .env.production
    environment:
      - ENV=production
      - DEBUG=0
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    networks:
      - production-net
    image: postgres:16-alpine
    container_name: quicksales_db_production
    environment:
      POSTGRES_DB: quicksales_prod
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - ./backups/production:/backups
    ports:
      - "5434:5432"  # Change in production, not usually exposed
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d quicksales_prod"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always
    command:
      - "postgres"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "max_connections=200"

  redis:
    networks:
      - production-net
    image: redis:7-alpine
    container_name: quicksales_redis_production
    volumes:
      - production_redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass ${REDIS_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    networks:
      - production-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicksales_celery_worker_production
    command: celery -A ImsV3 worker --loglevel=warning --concurrency=4 --max-tasks-per-child=1000
    volumes:
      - production_logs:/app/logs
    env_file:
      - .env.production
    environment:
      - ENV=production
    depends_on:
      - db
      - redis
    restart: always
    # Resource limits for production
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  celery_beat:
    networks:
      - production-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicksales_celery_beat_production
    command: celery -A ImsV3 beat --loglevel=warning --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - production_logs:/app/logs
    env_file:
      - .env.production
    environment:
      - ENV=production
    depends_on:
      - db
      - redis
    restart: always

  # Nginx Reverse Proxy (Optional - for production use)
  nginx:
    networks:
      - production-net
    image: nginx:alpine
    container_name: quicksales_nginx_production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - production_static:/app/staticfiles:ro
      - production_media:/app/media:ro
    depends_on:
      - web
    restart: always

volumes:
  production_postgres_data:
  production_redis_data:
  production_static:
  production_media:
  production_logs:
