<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Buyer Account — Quicksales Stores</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .auth-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 2.5rem; max-width: 480px; width: 100%; }
        .form-control { border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="auth-card shadow-sm">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Create Buyer Account</h4>
            <small class="text-muted">Shop and track orders seamlessly across any storefront</small>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} rounded-3 py-2 px-3 small mb-3">
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'buyer_register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            
            <div class="row g-2 mb-3">
                <div class="col-6">
                    <label class="form-label small fw-bold">First Name</label>
                    <input type="text" name="first_name" required class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label small fw-bold">Last Name</label>
                    <input type="text" name="last_name" required class="form-control">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" name="email" required class="form-control" placeholder="name@example.com">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Phone / WhatsApp</label>
                <input type="tel" name="phone_number" class="form-control" placeholder="080 1234 5678">
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold">Default Delivery Address</label>
                <textarea name="shipping_address" rows="2" class="form-control" placeholder="Street, City, State"></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Password (min 6 characters)</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3 mb-3">
                Create Account
            </button>
        </form>

        <div class="text-center small text-muted">
            Already have an account? <a href="{% url 'buyer_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="fw-bold text-primary text-decoration-none">Sign In</a>
        </div>
    </div>

</body>
</html>
