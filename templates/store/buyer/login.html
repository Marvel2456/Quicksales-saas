<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buyer Sign In — Quicksales Stores</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .auth-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 2.5rem; max-width: 440px; width: 100%; }
        .form-control { border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="auth-card shadow-sm">
        <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Buyer Sign In</h4>
            <small class="text-muted">Track all your online orders across vendor stores</small>
        </div>

        {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags|default:'info' }} rounded-3 py-2 px-3 small mb-3">
            {{ msg }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="post" action="{% url 'buyer_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" name="email" required class="form-control" placeholder="name@example.com">
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" name="password" required class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold py-3 mb-3">
                Sign In
            </button>
        </form>

        <div class="text-center small text-muted">
            Don't have a buyer account? <a href="{% url 'buyer_register' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}" class="fw-bold text-primary text-decoration-none">Sign Up</a>
        </div>
    </div>

</body>
</html>
