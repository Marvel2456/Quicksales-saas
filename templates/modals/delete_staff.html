<div class="modal fade" {% block modal-id %} id="deleteStaffModal{{staff.user.pk}}" {% endblock modal-id %} tabindex="-1" aria-labelledby="deleteStaffModalLabel{{staff.user.pk}}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="deleteStaffModalLabel{{staff.user.pk}}">
                    {% block modal-title %}<i class="fa-solid fa-trash-can text-danger"></i> Delete Staff Account{% endblock modal-title %}
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form {% block Action %} action="{% url 'delete_staff' %}" {% endblock Action %} method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body text-center py-4">
                    {% block Value-id %}
                    <input type="hidden" name="id" value="{{staff.user.id}}" readonly>
                    {% endblock Value-id %}
                    <p class="mb-1 fs-5 fw-semibold">Delete {{ staff.user.first_name }}'s account?</p>
                    <p class="text-muted small mb-0">This staff member will lose access immediately. This action cannot be undone.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-solid fa-trash-can me-1"></i>Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
