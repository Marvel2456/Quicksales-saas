<!-- Modal -->
<div class="modal fade" {% block modal-id %} id="addCategoryModal" {% endblock modal-id %} tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="addCategoryModalLabel">{% block modal-title %}<i class="fas fa-folder-plus text-primary"></i> Add Category{% endblock modal-title %}</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form {% block Action %} action="{% url 'category_list' branch.id %}" {% endblock Action %} method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="modal-body">
          {% block Value-id %}{% endblock Value-id %}

          <div class="mb-2">
            <label for="category_name" class="form-label">Category Name</label>
            <input name="category_name" type="text" class="form-control" placeholder="e.g. Footwear, Electronics" required {% block Value-category_name %} {% endblock Value-category_name %}>
            {% if form.category_name.errors %}<div class="text-danger small mt-1">{{form.category_name.errors}}</div>{% endif %}
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            {% block Btn-action %}<i class="fas fa-plus me-1"></i>Add Category{% endblock Btn-action %}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
