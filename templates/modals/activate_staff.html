<div class="modal fade" id="activateStaffModal{{staff.user.pk}}" tabindex="-1" aria-labelledby="activateStaffModalLabel{{staff.user.pk}}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="activateStaffModalLabel{{staff.user.pk}}">
                    <i class="fa-solid fa-user-check text-success"></i> Activate Account
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{% url 'activate_staff' %}" method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body text-center py-4">
                    <input type="hidden" name="id" value="{{staff.user.id}}" readonly>
                    <p class="mb-1 fs-5 fw-semibold">Activate {{ staff.user.first_name }}'s account?</p>
                    <p class="text-muted small mb-0">This staff member will be able to sign in and access their assigned branch.</p>
                </div>
                <div class="modal-footer justify-content-center">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success">
                        <i class="fa-solid fa-user-check me-1"></i>Activate
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
