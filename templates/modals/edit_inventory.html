<div class="modal fade" {% block modal-id %} id="reorderModal{{inventory.pk}}" {% endblock modal-id %} tabindex="-1" aria-labelledby="reorderModalLabel{{inventory.pk}}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="reorderModalLabel{{inventory.pk}}">
                    {% block modal-title %}<i class="fas fa-edit text-primary"></i> Set Reorder Level{% endblock modal-title %}
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form {% block Action %} action="{% url 'set_reorder' inventory.id %}" {% endblock Action %} method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                    {% block Value-id %}
                    <input type="hidden" name="id" value="{{inventory.id}}" readonly>
                    {% endblock Value-id %}

                    {% block Value-reorder_level %}
                    <div class="mb-2">
                        <label for="reorder_level_{{inventory.pk}}" class="form-label">Reorder Level</label>
                        <input type="number" min="0" id="reorder_level_{{inventory.pk}}" class="form-control" name="reorder_level" value="{{inventory.reorder_level}}">
                    </div>
                    {% endblock Value-reorder_level %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        {% block Btn-action %}<i class="fas fa-save me-1"></i>Save Changes{% endblock Btn-action %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
