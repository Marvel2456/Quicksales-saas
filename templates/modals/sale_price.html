{% block content %}

<div class="modal fade" {% block modal-id %} id="addSalePriceModal" {% endblock modal-id %} tabindex="-1" aria-labelledby="addSalePriceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="addSalePriceModalLabel">
                    {% block modal-title %}<i class="fas fa-tag text-primary"></i> Sale Price{% endblock modal-title %}
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form {% block Action %} action="" {% endblock Action %} method="POST" id="addSalePrice" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="mb-2">
                        <label for="salePrice" class="form-label">Sale Price</label>
                        <input type="text" class="form-control" name="sale_price" id="salePrice" value="{{products.sale_price}}" placeholder="0.00">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">
                        {% block Btn-action %}<i class="fa-solid fa-floppy-disk me-1"></i>Save{% endblock Btn-action %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('addSalePrice').addEventListener('submit', addSalePrice);

    function addSalePrice(e){
        e.preventDefault();
        var salePriceVal = document.getElementById('salePrice').value;

        var salePrice = new SalePrice();
        salePrice.append('sale_price', salePriceVal);
        salePrice.append('csrfmiddlewaretoken', '{{csrf_token }}');
        var url = '/product_details/';

        fetch(url, {
            method:'POST',
            headers:{
                'Content-Type':'application/json',
            },
            body: salePrice
        })
        .then((res) => res.json())
        .then((data) => console.log(data))
        .catch(error => {
            console.error('Error:', error);
        });
    }
</script>

{% endblock content %}
