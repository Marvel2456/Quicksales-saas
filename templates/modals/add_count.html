<div class="modal fade" {% block modal-id %} id="addCountModal{{inventory.pk}}" {% endblock modal-id %} tabindex="-1" aria-labelledby="addCountModalLabel{{inventory.pk}}" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
          <div class="modal-header">
              <h6 class="modal-title" id="addCountModalLabel{{inventory.pk}}">
                  {% block modal-title %}<i class="fas fa-clipboard-check text-primary"></i> Add Count{% endblock modal-title %}
              </h6>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form {% block Action %} action="{% url 'addcount' %}" {% endblock Action %} method="POST" enctype="multipart/form-data">
              {% csrf_token %}
              <div class="modal-body">
                  {% block Value-id %}
                  <input type="hidden" name="id" value="{{inventory.id}}" readonly>
                  {% endblock Value-id %}

                  {% block Value-count %}
                  <div class="mb-2">
                      <label for="count_{{inventory.pk}}" class="form-label">Quantity</label>
                      <input type="number" min="0" class="form-control" id="count_{{inventory.pk}}" name="count" placeholder="Enter count" value="">
                  </div>
                  {% endblock Value-count %}
              </div>
              <div class="modal-footer">
                  <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                  <button type="submit" class="btn btn-primary">
                      {% block Btn-action %}<i class="fa-solid fa-floppy-disk me-1"></i>Save{% endblock Btn-action %}
                  </button>
              </div>
          </form>
      </div>
  </div>
</div>
