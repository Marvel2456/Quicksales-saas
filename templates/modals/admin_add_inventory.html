<!-- Modal -->
<div class="modal fade" {% block modal-id %} id="adminAddInventoryModal" {% endblock modal-id %} tabindex="-1" aria-labelledby="adminAddInventoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title" id="adminAddInventoryModalLabel">{% block modal-title %}<i class="fas fa-boxes-stacked text-primary"></i> Create Inventory{% endblock modal-title %}</h6>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form {% block Action %} action="" {% endblock Action %} method="POST" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="modal-body">
            {% block Value-id %}{% endblock Value-id %}

            <div class="mb-3">
              <label for="id_product" class="form-label">Product</label>
              <select id="id_product" name="product" class="form-select" required {% block Value-product %} {% endblock Value-product %}>
                {% if not inventory.product %}
                <option value="" disabled selected>Select Product</option>
                {% else %}
                <option value="" disabled></option>
                {% endif %}
                {% for product in product %}
                    {% if inventory.product == product.id %}
                    <option value="{{ product.id }}" selected>{{ product.product_name }}</option>
                    {% else %}
                    <option value="{{ product.id }}">{{ product.product_name }}</option>
                    {% endif %}
                {% endfor %}
              </select>
              {% if form.product.errors %}<div class="text-danger small mt-1">{{form.product.errors}}</div>{% endif %}
            </div>

            <div class="mb-3">
              <label for="branch" class="form-label">Branch</label>
              {{form.branch}}
              {% if form.branch.errors %}<div class="text-danger small mt-1">{{form.branch.errors}}</div>{% endif %}
            </div>

            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="quantity" class="form-label">Quantity</label>
                <input name="quantity" type="number" min="0" class="form-control" placeholder="0" required {% block Value-quantity %} {% endblock Value-quantity %}>
              </div>
              <div class="col-sm-6">
                <label for="reorder_level" class="form-label">Reorder Level</label>
                <input name="reorder_level" type="number" min="0" class="form-control" placeholder="0" {% block Value-reorder_level %} {% endblock Value-reorder_level %}>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-sm-6">
                <label for="cost_price" class="form-label">Cost Price</label>
                <input name="cost_price" type="text" class="form-control" placeholder="0.00" required {% block Value-cost_price %} {% endblock Value-cost_price %}>
              </div>
              <div class="col-sm-6">
                <label for="sale_price" class="form-label">Sale Price</label>
                <input name="sale_price" type="text" class="form-control" placeholder="0.00" required {% block Value-sale_price %} {% endblock Value-sale_price %}>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="reset" class="btn btn-light border" title="Reset"><i class="fas fa-sync-alt me-1"></i>Reset</button>
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">
              {% block Btn-action %}<i class="fas fa-plus me-1"></i>Create Inventory{% endblock Btn-action %}
            </button>
          </div>
        </form>
      </div>
    </div>
</div>
