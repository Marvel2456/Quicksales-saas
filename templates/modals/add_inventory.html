<!-- Modal -->
<div class="modal fade" {% block modal-id %} id="addInventoryModal" {% endblock modal-id %} tabindex="-1" aria-labelledby="addInventoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="addInventoryModalLabel">{% block modal-title %}<i class="fas fa-boxes-stacked text-primary"></i> Create Inventory{% endblock modal-title %}</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <!--Forms begins-->
      <form action="" method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="modal-body">

        <!--==Block Id==-->
        {% block Value-id %}  {% endblock Value-id %}

        <div class="mb-3">
          <label for="id_product" class="form-label">Product</label>
          <select id="id_product" name="product" class="form-select" required {% block Value-product %} {% endblock Value-product %}>
          {% if not inventory.product %}
          <option value="" disabled selected>Select Product</option>
          {% else %}
          <option value="" disabled></option>
          {% endif %}
          {% for product in product %}
              {% if inventory.product == product.id %}
              <option value="{{ product.id }}" selected>{{ product.product_name }}</option>
              {% else %}
              <option value="{{ product.id }}">{{ product.product_name }}</option>
              {% endif %}
          {% endfor %}
          </select>
          {% if form.product.errors %}<div class="text-danger small mt-1">{{form.product.errors}}</div>{% endif %}
        </div>

          <!-- Variation Quantity Toggle -->
          <div class="mb-3 p-3 bg-light rounded-3 border">
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch" id="useVariationQuantities" name="use_variation_quantities" onchange="toggleInvVariationQuantities(this.checked)">
              <label class="form-check-label small fw-semibold" for="useVariationQuantities">Specify quantity per variation?</label>
            </div>
            <div id="variationQtySection" class="d-none mt-2 pt-2 border-top">
              <div id="variationQtyRows" class="d-flex flex-column gap-2"></div>
              <button type="button" class="btn btn-sm btn-outline-primary mt-2" onclick="addInvVariationRow('', 0)"><i class="fas fa-plus me-1"></i>Add Variation</button>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="addInvQuantity" class="form-label">Total Quantity</label>
              <input name="quantity" id="addInvQuantity" type="number" min="0" class="form-control" placeholder="0" required {% block Value-quantity %} {% endblock Value-quantity %}>
            </div>
            <div class="col-sm-6">
              <label for="reorder_level" class="form-label">Reorder Level</label>
              <input name="reorder_level" type="number" min="0" class="form-control" placeholder="0" {% block Value-reorder_level %}value="0"{% endblock Value-reorder_level %}>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-sm-6">
              <label for="cost_price" class="form-label">Cost Price <span class="text-danger">*</span></label>
              <input name="cost_price" id="cost_price" type="number" min="0" step="any" class="form-control" placeholder="0.00" required {% block Value-cost_price %} {% endblock Value-cost_price %}>
            </div>
            <div class="col-sm-6">
              <label for="sale_price" class="form-label">Sale Price <span class="text-danger">*</span></label>
              <input name="sale_price" id="sale_price" type="number" min="0" step="any" class="form-control" placeholder="0.00" required {% block Value-sale_price %} {% endblock Value-sale_price %}>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="reset" class="btn btn-light border" title="Reset">
            <i class="fas fa-sync-alt me-1"></i>Reset
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            {% block Btn-action %}<i class="fas fa-plus me-1"></i>Create Inventory{% endblock Btn-action %}
          </button>
        </div>
      </form>
      <!--Form ends-->
    </div>
  </div>
</div>

<script>
const INV_PRODUCT_VARIATIONS = {{ product_variations_json|default:"{}"|safe }};

function recalcInvVariationTotal() {
  var rows = document.querySelectorAll('#variationQtyRows .inv-var-qty-input');
  var total = 0;
  rows.forEach(function(inp) {
    var val = parseInt(inp.value || '0', 10);
    if (!isNaN(val) && val > 0) total += val;
  });
  var qtyEl = document.getElementById('addInvQuantity');
  if (qtyEl) qtyEl.value = total;
}

function addInvVariationRow(name, qty) {
  var container = document.getElementById('variationQtyRows');
  if (!container) return;
  var row = document.createElement('div');
  row.className = 'd-flex align-items-center gap-2 inv-var-row';
  row.innerHTML =
    '<input type="text" name="variation_name[]" class="form-control form-control-sm" placeholder="Variation (e.g. Black)" value="' + (name || '').replace(/"/g, '&quot;') + '" required>' +
    '<input type="number" min="0" name="variation_qty[]" class="form-control form-control-sm inv-var-qty-input" style="max-width:95px;" placeholder="Qty" value="' + (qty || 0) + '" oninput="recalcInvVariationTotal()">' +
    '<button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest(\'.inv-var-row\').remove(); recalcInvVariationTotal();">&times;</button>';
  container.appendChild(row);
  recalcInvVariationTotal();
}

function populateInvVariationRowsForProduct() {
  var prodSelect = document.getElementById('id_product');
  var container = document.getElementById('variationQtyRows');
  if (!prodSelect || !container) return;
  container.innerHTML = '';
  var opts = INV_PRODUCT_VARIATIONS[prodSelect.value] || [];
  if (opts.length > 0) {
    opts.forEach(function(opt) { addInvVariationRow(opt, 0); });
  } else {
    addInvVariationRow('', 0);
  }
}

function toggleInvVariationQuantities(enabled) {
  var section = document.getElementById('variationQtySection');
  var qtyEl = document.getElementById('addInvQuantity');
  if (!section || !qtyEl) return;
  section.classList.toggle('d-none', !enabled);
  qtyEl.readOnly = enabled;
  if (enabled) {
    populateInvVariationRowsForProduct();
  } else {
    document.getElementById('variationQtyRows').innerHTML = '';
  }
}

document.addEventListener('DOMContentLoaded', function() {
  var prodSelect = document.getElementById('id_product');
  if (prodSelect) {
    prodSelect.addEventListener('change', function() {
      var toggle = document.getElementById('useVariationQuantities');
      if (toggle && toggle.checked) {
        populateInvVariationRowsForProduct();
      }
    });
  }
});
</script>
