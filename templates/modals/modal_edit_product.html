<!-- modal_edit_product.html -->
<div class="modal fade" id="editProductModal{{ product.pk }}" tabindex="-1" aria-labelledby="editProductLabel{{ product.pk }}" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="POST" action="{% url 'edit_product' product.id %}">
        {% csrf_token %}
        <div class="modal-header">
          <h5 class="modal-title" id="editProductLabel{{ product.pk }}">
            <i class="fas fa-edit"></i>&nbsp;&nbsp; Edit Product
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <div class="modal-body">
          <input type="hidden" name="id" value="{{ product.id }}">

          <div class="mb-3">
            <label for="productName{{ product.pk }}" class="form-label">Product Name</label>
            <input type="text" class="form-control" id="productName{{ product.pk }}" name="product_name" value="{{ product.product_name }}">
          </div>

          <div class="mb-3">
            <label for="brand{{ product.pk }}" class="form-label">Brand</label>
            <input type="text" class="form-control" id="brand{{ product.pk }}" name="brand" value="{{ product.brand }}">
          </div>

          {% comment %} <div class="mb-3">
            <label for="category{{ product.pk }}" class="form-label">Category</label>
            <select class="form-select" id="category{{ product.pk }}" name="category" required>
              <option value="" disabled>Select Category</option>
              {% for category in categories %}
                <option value="{{ category.id }}" {% if product.category and category.id == product.category.id %}selected{% endif %}>
                  {{ category.category_name }}
                </option>
              {% endfor %}
            </select>
          </div> {% endcomment %}

          <div class="mb-3">
            <label for="category{{ product.pk }}" class="form-label">Category</label>
            {{ form.category }}
          </div>





          <div class="mb-3">
            <label for="unit{{ product.pk }}" class="form-label">Unit</label>
            <input type="text" class="form-control" id="unit{{ product.pk }}" name="unit" value="{{ product.unit }}">
          </div>

          <div class="mb-3">
            <label for="batchNo{{ product.pk }}" class="form-label">Batch No</label>
            <input type="text" class="form-control" id="batchNo{{ product.pk }}" name="batch_no" value="{{ product.batch_no }}">
          </div>
        </div>

        <div class="modal-footer">
          <div class="mt-4 text-center" style="width:100%;">
            <button type="submit" class="btn btn-secondary">
              <i class="fas fa-plus"></i>&nbsp;&nbsp; Save
            </button>
            
            <button type="reset" class="btn btn-secondary" title="Reset">
              <i class="fas fa-sync-alt"></i>
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
