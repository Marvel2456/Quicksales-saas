<!-- Modal -->
<div class="modal fade" id="addStaffModal" tabindex="-1" aria-labelledby="addStaffModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="addStaffModalLabel">
          <i class="fas fa-user-plus text-primary"></i> Add Staff
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form {% if branch and branch.id %}action="{% url 'staff' branch.id %}"{% else %}action="#"{% endif %} method="POST">
        {% csrf_token %}

        <div class="modal-body">
          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="first_name" class="form-label">First Name</label>
              <input name="first_name" type="text" class="form-control" placeholder="First Name" required>
            </div>
            <div class="col-sm-6">
              <label for="last_name" class="form-label">Last Name</label>
              <input name="last_name" type="text" class="form-control" placeholder="Last Name" required>
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input name="email" type="email" class="form-control" placeholder="staff@company.com" required>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label for="phone_number" class="form-label">Phone Number</label>
              <input name="phone_number" type="text" class="form-control" placeholder="Phone Number" required>
            </div>
            <div class="col-sm-6">
              <label for="role" class="form-label">Role</label>
              <select name="role" class="form-select" required>
                <option value="" disabled selected>Select Role</option>
                <option value="owner">Owner</option>
                <option value="manager">Manager</option>
                <option value="sales">Sales</option>
              </select>
            </div>
          </div>

          <div class="border rounded-3 p-3 bg-light">
            <label class="form-label fw-semibold mb-1">Feature Permissions (Optional Extra Access)</label>
            <div class="small text-muted mb-2">
              Assign additional features to this staff member for this branch (e.g., allow a Sales Rep to create &amp; view their own invoices).
            </div>
            {% for perm_key, perm_label in staff_permission_choices %}
            <div class="form-check mb-1">
              <input class="form-check-input" type="checkbox" name="permissions" value="{{ perm_key }}" id="add_perm_{{ perm_key }}">
              <label class="form-check-label" for="add_perm_{{ perm_key }}">
                {{ perm_label }}
              </label>
            </div>
            {% endfor %}
          </div>
        </div>

        <div class="modal-footer">
          <button type="reset" class="btn btn-light border" title="Reset">
            <i class="fas fa-sync-alt me-1"></i>Reset
          </button>
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-plus me-1"></i>Add Staff
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
