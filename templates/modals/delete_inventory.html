<div class="modal fade" {% block modal-id %} id="deleteInventoryModal{{inventory.pk}}" {% endblock modal-id %} tabindex="-1" aria-labelledby="deleteInventoryModalLabel{{inventory.pk}}" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h6 class="modal-title" id="deleteInventoryModalLabel{{inventory.pk}}">
                    {% block modal-title %}<i class="fa-solid fa-trash-can text-danger me-2"></i>Delete Inventory{% endblock modal-title %}
                </h6>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form {% block Action %} action="{% url 'delete_inventory' inventory.id %}" {% endblock Action %} method="POST">
                {% csrf_token %}
                <div class="modal-body text-center py-4">
                    {% block Value-id %}
                    <input type="hidden" name="id" value="{{inventory.id}}" readonly>
                    {% endblock Value-id %}
                    <p class="mb-1 fs-5 fw-semibold">Delete inventory for "{{ inventory.product.product_name }}"?</p>
                    <p class="text-muted small mb-0">This will remove this inventory record from {{ inventory.branch.name }}. This action cannot be undone.</p>
                </div>
                <div class="modal-footer justify-content-center border-0 pt-0 pb-3">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-danger">
                        <i class="fa-solid fa-trash-can me-1"></i>Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
