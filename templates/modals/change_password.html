<!-- Change Password Modal -->
<div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg" style="border-radius: 20px;">
      <div class="modal-header border-bottom-0 pb-0">
        <h5 class="modal-title fw-bold" id="changePasswordModalLabel" style="font-size: 1.25rem;">Change Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form method="post" action="{% url 'change_password' %}" id="changePasswordForm">
        {% csrf_token %}
        <div class="modal-body pt-3">
          <p class="text-muted small mb-4">Please enter your current password and choose a strong new password.</p>

          <div class="mb-3">
            <label for="current_password" class="form-label small fw-semibold text-dark">Current Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="current_password" name="current_password" required
                style="border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #d1d5db; background-color: #f9fafb;">
              <button type="button" onclick="togglePasswordModal('current_password', this)"
                class="btn p-0 position-absolute top-50 end-0 translate-middle-y me-3 text-secondary border-0 bg-transparent">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="new_password" class="form-label small fw-semibold text-dark">New Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="new_password" name="new_password" required
                style="border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #d1d5db; background-color: #f9fafb;">
              <button type="button" onclick="togglePasswordModal('new_password', this)"
                class="btn p-0 position-absolute top-50 end-0 translate-middle-y me-3 text-secondary border-0 bg-transparent">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirm_password" class="form-label small fw-semibold text-dark">Confirm New Password</label>
            <div class="position-relative">
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required
                style="border-radius: 12px; padding: 0.75rem 1rem; border: 1px solid #d1d5db; background-color: #f9fafb;">
              <button type="button" onclick="togglePasswordModal('confirm_password', this)"
                class="btn p-0 position-absolute top-50 end-0 translate-middle-y me-3 text-secondary border-0 bg-transparent">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Password Requirements -->
          <div class="bg-light rounded-3 p-3 small text-muted mb-2">
            <div class="d-flex align-items-center gap-2 mb-1" id="m-req-length">
              <i class="bi bi-check-lg gray-icon fs-5"></i>
              <span>At least 8 characters</span>
            </div>
            <div class="d-flex align-items-center gap-2 mb-1" id="m-req-match">
              <i class="bi bi-check-lg gray-icon fs-5"></i>
              <span>Passwords must match</span>
            </div>
            <div class="d-flex align-items-center gap-2" id="m-req-numeric">
              <i class="bi bi-check-lg gray-icon fs-5"></i>
              <span>Must not be entirely numeric</span>
            </div>
          </div>
        </div>
        <div class="modal-footer border-top-0 pt-0 pb-4 justify-content-center">
          <button type="button" class="btn btn-light px-4 fw-semibold" data-bs-dismiss="modal" style="border-radius: 12px; padding: 0.75rem 1rem;">Cancel</button>
          <button type="submit" id="changePasswordSubmit" class="btn btn-primary px-4 fw-semibold" disabled style="border-radius: 12px; padding: 0.75rem 1rem;">Update Password</button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
  .gray-icon { color: #9CA3AF; }
  .check-icon { color: #10B981; }
  .text-success-custom { color: #16a34a !important; }
</style>

<script>
  function togglePasswordModal(fieldId, btn) {
    const input = document.getElementById(fieldId);
    const icon = btn.querySelector('i');
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove('bi-eye');
      icon.classList.add('bi-eye-slash');
    } else {
      input.type = "password";
      icon.classList.remove('bi-eye-slash');
      icon.classList.add('bi-eye');
    }
  }

  function validateChangePasswords() {
    const newPassword = document.getElementById('new_password').value;
    const confirmPassword = document.getElementById('confirm_password').value;
    const submitBtn = document.getElementById('changePasswordSubmit');

    // Requirement elements
    const reqLength = document.getElementById('m-req-length');
    const reqMatch = document.getElementById('m-req-match');
    const reqNumeric = document.getElementById('m-req-numeric');

    const updateReq = (el, condition) => {
      const icon = el.querySelector('i');
      if (condition) {
        el.classList.add('text-success-custom');
        icon.classList.remove('gray-icon');
        icon.classList.add('check-icon');
      } else {
        el.classList.remove('text-success-custom');
        icon.classList.add('gray-icon');
        icon.classList.remove('check-icon');
      }
    };

    const isLengthValid = newPassword.length >= 8;
    const isMatchValid = newPassword.length > 0 && newPassword === confirmPassword;
    const isNotNumeric = newPassword.length > 0 && !/^\d+$/.test(newPassword);

    updateReq(reqLength, isLengthValid);
    updateReq(reqMatch, isMatchValid);
    updateReq(reqNumeric, isNotNumeric);

    submitBtn.disabled = !(isLengthValid && isMatchValid && isNotNumeric);
  }

  document.getElementById('new_password').addEventListener('input', validateChangePasswords);
  document.getElementById('confirm_password').addEventListener('input', validateChangePasswords);
</script>
