{% extends 'base.html' %}
{% load static %}

{% block title %} Create Ticket {% endblock title %}

{% block content %}
<div class="app-content pt-3 p-md-3 p-lg-4">
    <div class="container-xl">
        <div class="row g-3 mb-4 align-items-center justify-content-between">
            <div class="col-auto">
                <h1 class="app-page-title mb-0">Create Ticket</h1>
            </div>
        </div>

        <div class="app-card app-card-settings shadow-sm p-4">
            <div class="app-card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3 col-md-6">
                        <label for="id_title" class="form-label">Title</label>
                        {{ form.title }}
                    </div>
                    <div class="mb-3 col-md-8">
                        <label for="id_description" class="form-label">Description</label>
                        {{ form.description }}
                    </div>
                    <div class="mb-3 col-md-6">
                        <label for="id_assigned_to" class="form-label">Assign To</label>
                        {{ form.assigned_to }}
                    </div>
                    <button type="submit" class="btn app-btn-primary">
                        <i class="fas fa-plus"></i>&nbsp; Add Ticket
                    </button>
                    <a href="{% url 'ticket' %}" class="btn app-btn-secondary ms-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
