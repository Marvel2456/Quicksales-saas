{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Reset Link Sent | Quicksales</title>

    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="MARVEX">
    <link rel="shortcut icon" href="{% static 'assets/images/mq.png' %}">

    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- App CSS -->
    <link id="theme-style" rel="stylesheet" href="{% static 'assets/css/portal.css' %}">

    <style>
        :root {
            --bg-1: #e6eeff;
            --bg-2: #f4f6fb;
            --card: #ffffff;
            --text: #1f2a44;
            --muted: #6b7280;
            --primary: #2f5ef0;
            --primary-dark: #2448bf;
            --border: #e5e7ef;
            --shadow: 0 24px 48px rgba(17, 24, 39, 0.12);
        }

        body {
            margin: 0;
            font-family: 'Manrope', sans-serif;
            color: var(--text);
            background: radial-gradient(1200px 600px at 50% -200px, var(--bg-1) 0%, var(--bg-2) 55%, #f1f3f8 100%);
        }

        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            width: 420px;
            max-width: 100%;
            background: var(--card);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 34px 36px 30px;
            text-align: center;
            border: 1px solid #eef1f6;
        }

        .auth-logo img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .icon-badge {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            color: var(--primary);
            font-size: 24px;
            margin: 12px 0 10px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            margin: 4px 0 6px;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 14px;
        }

        .auth-footer {
            margin-top: 16px;
            font-size: 12px;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-logo">
                <img src="{% static 'assets/images/mq_logo.png' %}" style="width: 100px; height: 100px;" alt="Quicksales">
            </div>
            <div class="icon-badge">
                <i class="bi bi-send"></i>
            </div>
            <h1 class="auth-title">Check your mail</h1>
            <p class="auth-subtitle">We've sent a magic link to your mail to reset your password</p>

            <div class="auth-footer">
                Didn't get mail? <a href="{% url 'forgot_password' %}">Resend mail</a>
            </div>
        </section>
    </main>
</body>
</html>
