{% load static %}
<!DOCTYPE html>
<html lang="en"> 
<head>
    <title>CLT {% block title %} {% endblock title %}</title>
    
    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="description" content="Quicksales login">
    <meta name="author" content="MARVEX">    
    <link rel="shortcut icon" href="favicon.ico"> 
    
    <!-- FontAwesome JS-->
    <script defer src="{% static 'assets/plugins/fontawesome/js/all.min.js' %}"></script>
    
	<!-- App CSS -->  
	<link id="theme-style" rel="stylesheet" href="{% static 'assets/css/portal.css' %}">
    <!-- Bootstrap Icons for robust toggle icon switching -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
	<!-- htmx for lightweight interactivity -->
	<script src="{% static 'assets/js/htmx.min.js' %}"></script>
    
    <style>
        /* Password Toggle Button */
        .password-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-input-group .form-control {
            padding-right: 38px;
        }
        
        .toggle-password-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6c757d;
            font-size: 16px;
            padding: 6px 8px;
            z-index: 100;
            line-height: 1;
            transition: color 0.2s ease;
        }
        
        .toggle-password-btn:hover {
            color: #495057;
        }
        
        .toggle-password-btn:focus {
            outline: none;
            box-shadow: none;
        }
    </style>

</head> 

<body class="app app-login p-0">  
	{% include 'ims/message.html' %}  
    <div class="row g-0 app-auth-wrapper auth-background-holder">
	    <div class="col-12 col-md-7 col-lg-6 auth-main-col text-center p-5">
		    <div class="d-flex flex-column align-content-center">
			    <div class="app-auth-body mx-auto">	
				    <div class="app-auth-branding mb-4"><a class="app-logo" href="#"><h1>Quicksales</h1></a></div>
					<h2 class="auth-heading text-center mb-5">Log in to Quicksales</h2>
			        <div class="auth-form-container text-start">
						<form class="auth-form login-form" method="post"> 
							{% csrf_token %}        
							<div class="email mb-3">
								<label class="sr-only" for="signin-email">Email</label>
								<input id="signin-email" name="email" type="text" class="form-control signin-email" placeholder="Email" required="required">
							</div><!--//form-group-->
							<div class="password mb-3">
								<label class="sr-only" for="signin-password">Password</label>
							<div class="password-input-group">
								<input id="signin-password" name="password" type="password" class="form-control signin-password" placeholder="Password" required="required">
                                <button type="button" class="toggle-password-btn" id="togglePassword" title="Show/Hide password" aria-label="Toggle password visibility"
                                    hx-on:click="event.preventDefault(); const input = document.getElementById('signin-password'); const icon = this.querySelector('i'); if (input.type === 'password') { input.type = 'text'; icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye'); } else { input.type = 'password'; icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash'); }">
                                    <i class="bi bi-eye-slash"></i>
								</button>
							</div>
								<div class="extra mt-3 row justify-content-between">
								</div><!--//extra-->
							</div><!--//form-group-->
							<div class="text-center">
								<button type="submit" class="btn app-btn-primary w-100 theme-btn mx-auto">Log In</button>
							</div>
						</form>
					</div><!--//auth-form-container-->	

			    </div><!--//auth-body-->
		    
			    <footer class="app-auth-footer">
				    <div class="container text-center py-3">
			        
				    </div>
			    </footer><!--//app-auth-footer-->	
		    </div><!--//flex-column-->   
	    </div><!--//auth-main-col-->
    
    </div><!--//row-->
	<script src="{% static 'assets/js/jQuery 3.6.1.min.js' %}"></script>
	<script>
        setTimeout(function(){
            if ($('#msg').length > 0 ){
                $('#msg').remove();
            }
        }, 4000)
    </script>
    
	<!-- Password toggle handled via htmx hx-on above -->

</body>
</html>
