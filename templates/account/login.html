{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | Quicksales</title>

    <!-- Meta -->
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quicksales login">
    <meta name="author" content="MARVEX">
    <link rel="shortcut icon" href="{% static 'assets/images/mq.png' %}">

    <!-- Fonts and Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- App CSS -->
    <link id="theme-style" rel="stylesheet" href="{% static 'assets/css/portal.css' %}">

    <style>
        /* Uncut Sans Font Registration */
        @font-face {
            font-family: 'Uncut Sans';
            src: url("{% static 'assets/plugins/uncut/Uncut-Sans-Regular.otf' %}") format('opentype');
            font-weight: 400;
            font-style: normal;
        }
        @font-face {
            font-family: 'Uncut Sans';
            src: url("{% static 'assets/plugins/uncut/Uncut-Sans-Medium.otf' %}") format('opentype');
            font-weight: 500;
            font-style: normal;
        }
        @font-face {
            font-family: 'Uncut Sans';
            src: url("{% static 'assets/plugins/uncut/Uncut-Sans-Semibold.otf' %}") format('opentype');
            font-weight: 600;
            font-style: normal;
        }
        @font-face {
            font-family: 'Uncut Sans';
            src: url("{% static 'assets/plugins/uncut/Uncut-Sans-Bold.otf' %}") format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        :root {
            --bg-1: #F7F7F7;
            --bg-2: #F7F7F7;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563EB;
            --primary-dark: #1d4ed8;
            --border: #d1d5db;
            --shadow: 0 24px 48px rgba(17, 24, 39, 0.12);
        }

        body {
            margin: 0;
            font-family: 'Uncut Sans', sans-serif !important;
            color: var(--text);
            background: var(--bg-1);
        }

        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 16px;
        }

        .auth-card {
            width: 420px;
            max-width: 100%;
            background: var(--card);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 34px 36px 30px;
            text-align: center;
            border: 1px solid #eef1f6;
        }

        .auth-logo img {
            width: 54px;
            height: 54px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .auth-title {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }

        .auth-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin: 8px 0 22px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            background: #f9fafb;
        }

        .form-control:focus {
            outline: none;
            border-color: #2563EB;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }

        .password-input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input-group .form-control {
            padding-right: 36px;
        }

        .toggle-password-btn {
            position: absolute;
            right: 10px;
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
            font-size: 16px;
            padding: 4px;
        }

        .auth-links {
            text-align: left;
            margin: 6px 0 14px;
        }

        .auth-link {
            color: var(--primary);
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link:hover {
            text-decoration: underline;
        }

        .primary-btn {
            width: 100%;
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
        }

        .primary-btn:hover {
            background: var(--primary-dark);
        }

        .secondary-btn {
            width: 100%;
            background: #eff6ff;
            color: var(--primary);
            border: 1px solid #bfdbfe;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
        }

        .secondary-btn:hover {
            background: #dbeafe;
        }

        .auth-footer {
            margin-top: 18px;
            font-size: 12px;
            color: var(--muted);
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    {% include 'ims/message.html' %}

    <main class="auth-shell">
        <section class="auth-card">
            <div class="auth-logo">
                <img src="{% static 'assets/images/mq_logo.png' %}" style="width: 100px; height: 100px;" alt="Quicksales">
            </div>
            <h1 class="auth-title">Login</h1>
            <p class="auth-subtitle">Enter your email to get started</p>

            {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="signin-email">Business Email</label>
                    <input id="signin-email" name="email" type="email" class="form-control" placeholder="Business Email" autocomplete="email" value="{{ email }}" required autofocus>
                </div>

                <button type="submit" class="primary-btn">Continue <i class="bi bi-arrow-right ms-2"></i></button>
            </form>

            {% if show_resend_verification and email %}
            <form method="post" action="{% url 'resend_verification_email' %}">
                {% csrf_token %}
                <input type="hidden" name="email" value="{{ email }}">
                <button type="submit" class="secondary-btn">Resend verification email</button>
            </form>
            {% endif %}

            <div class="auth-footer">
                Don't have an account yet? <a href="{% url 'register' %}">Sign up</a>
            </div>
        </section>
    </main>

    <script>
    </script>
</body>
</html>
