{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Marvex Quicksales | Register</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- Animate.css CDN for extra animations -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
</head>
<body class="bg-[#00004d] min-h-screen flex items-center justify-center">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-lg p-8 animate__animated animate__fadeInDown">
        <div class="flex justify-center mb-6">
            <img src="{% static 'assets/images/mq_logo.png' %}" alt="Marvex Quicksales Logo" class="h-16 w-auto">
        </div>
        <h2 class="text-2xl font-bold text-center text-[#00004d] mb-6">Create Your Organization Account</h2>
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label for="email" class="block mb-1 font-medium text-[#00004d]">Email</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>
            <div class="flex gap-4">
                <div class="w-1/2">
                    <label for="first_name" class="block mb-1 font-medium text-[#00004d]">First Name</label>
                    <input type="text" id="first_name" name="first_name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
                </div>
                <div class="w-1/2">
                    <label for="last_name" class="block mb-1 font-medium text-[#00004d]">Last Name</label>
                    <input type="text" id="last_name" name="last_name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
                </div>
            </div>
            <div>
                <label for="phone_number" class="block mb-1 font-medium text-[#00004d]">Phone Number</label>
                <input type="text" id="phone_number" name="phone_number" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>
            <div>
                <label for="organization_name" class="block mb-1 font-medium text-[#00004d]">Organization Name</label>
                <input type="text" id="organization_name" name="organization_name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>
            <div>
                <label for="organization_country" class="block mb-1 font-medium text-[#00004d]">Country</label>
                <input type="text" id="organization_country" name="organization_country" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>
            <div>
                <label for="branch_name" class="block mb-1 font-medium text-[#00004d]">Branch Name</label>
                <input type="text" id="branch_name" name="branch_name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>
            <div>
                <label for="branch_address" class="block mb-1 font-medium text-[#00004d]">Branch Address</label>
                <input type="text" id="branch_address" name="branch_address" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
            </div>

            <div>
                <label for="business_type" class="block mb-1 font-medium text-[#00004d]">Business Type</label>
                <select id="business_type" name="business_type" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d]">
                    {% for key, value in form.business_type.field.choices %}
                        <option value="{{ key }}">{{ value }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="password" class="block mb-1 font-medium text-[#00004d]">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password1" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d] pr-12">
                    <button type="button" onclick="togglePassword('password', this)" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-[#00004d] focus:outline-none">
                        <i class="bi bi-eye-slash" id="password-eye"></i>
                    </button>
                </div>
            </div>
            <div>
                <label for="confirm_password" class="block mb-1 font-medium text-[#00004d]">Confirm Password</label>
                <div class="relative">
                    <input type="password" id="confirm_password" name="password2" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-[#00004d] pr-12">
                    <button type="button" onclick="togglePassword('confirm_password', this)" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-[#00004d] focus:outline-none">
                        <i class="bi bi-eye-slash" id="confirm-password-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-[#00004d] text-white py-3 rounded-lg font-semibold hover:bg-blue-900 transition animate__animated animate__pulse">Register</button>
        </form>
        <p class="mt-6 text-center text-gray-600">Already have an account? <a href="{% url 'login' %}" class="text-[#00004d] font-semibold hover:underline">Login</a></p>
    </div>


    <script>
    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === "password") {
            input.type = "text";
            icon.classList.add('bi-eye');
            icon.classList.remove('bi-eye-slash');
        } else {
            input.type = "password";
            icon.classList.add('bi-eye-slash');
            icon.classList.remove('bi-eye');
        }
    }
    </script>
</body>
</html>
