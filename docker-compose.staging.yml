version: '3.8'

# Staging Environment Docker Compose
# Usage: docker-compose -f docker-compose.staging.yml up -d

networks:
  staging-net:
    driver: bridge

services:
  web:
    networks:
      - staging-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicksales_staging
    command: >
      sh -c "
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      gunicorn ImsV3.wsgi:application --bind 0.0.0.0:8000 --workers=3
      "
    ports:
      - "8001:8000"  # Different port from development
    volumes:
      - .:/app
      - staging_static:/app/staticfiles
    depends_on:
      - db
      - redis
    env_file:
      - .env.staging
    environment:
      - ENV=staging
      - DEBUG=0
      - DB_NAME=quicksales_staging
      - DB_HOST=db-staging
      - CELERY_BROKER_URL=redis://redis-staging:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-staging:6379/0
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    networks:
      - staging-net
    image: postgres:16
    container_name: quicksales_db_staging
    environment:
      POSTGRES_DB: quicksales_staging
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./backups/staging:/backups  # For database backups
    ports:
      - "5433:5432"  # Different port from development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d quicksales_staging"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  redis:
    networks:
      - staging-net
    image: redis:7-alpine
    container_name: quicksales_redis_staging
    ports:
      - "6380:6379"  # Different port from development
    volumes:
      - staging_redis_data:/data
    command: redis-server --appendonly yes
    restart: on-failure

  celery_worker:
    networks:
      - staging-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicksales_celery_worker_staging
    command: celery -A ImsV3 worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    env_file:
      - .env.staging
    environment:
      - ENV=staging
      - CELERY_BROKER_URL=redis://redis-staging:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-staging:6379/0
    depends_on:
      - db
      - redis
    restart: on-failure

  celery_beat:
    networks:
      - staging-net
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quicksales_celery_beat_staging
    command: celery -A ImsV3 beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env.staging
    environment:
      - ENV=staging
      - CELERY_BROKER_URL=redis://redis-staging:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-staging:6379/0
    depends_on:
      - db
      - redis
    restart: on-failure

  pgadmin:
    networks:
      - staging-net
    image: dpage/pgadmin4
    container_name: quicksales_pgadmin_staging
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5051:80"  # Different port from development
    depends_on:
      - db
    restart: on-failure

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_static:
